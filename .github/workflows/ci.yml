name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # dist/ is what consumers run. It must be the build of this source.
      - run: bun run build
      - name: dist is up to date
        run: git diff --exit-code -- dist || { echo "::error::dist/ is stale — run 'bun run build' and commit it"; exit 1; }
      # The bundle must run on plain Node (the action runtime), not only on bun.
      - run: node dist/cli.js version
